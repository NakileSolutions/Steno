[workspace]
resolver = "2"
members = ["crates/steno-core", "crates/steno-cli", "crates/steno-audio-linux", "app/src-tauri"]
default-members = ["crates/steno-core", "crates/steno-cli", "crates/steno-audio-linux", "app/src-tauri"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
unicode-normalization = "0.1"
dirs = "6"
which = "8"
clap = { version = "4", features = ["derive"] }
steno-core = { path = "crates/steno-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
