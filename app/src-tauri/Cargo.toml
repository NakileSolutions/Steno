[package]
name = "steno-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sténo — assistant de réunion local (barre de menu)"

[lib]
name = "steno_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "steno-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
steno-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
dirs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Clic sur une notification (le plugin de notification ne le gère pas sur macOS).
mac-notification-sys = "0.6"
