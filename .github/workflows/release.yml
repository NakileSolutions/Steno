name: Release

# A vX.Y.Z tag (signed, pushed by an administrator: tags are protected) publishes the release on
# GitHub. Installed Sténo apps detect it and offer the update.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is annotated, on main, carries this name and is signed by a release key
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" "+refs/heads/main:refs/remotes/origin/main"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag || { echo "::error::tag is not annotated"; exit 1; }
          git cat-file tag "refs/tags/$GITHUB_REF_NAME" | sed '/^$/q' | grep -qFx "tag $GITHUB_REF_NAME" || { echo "::error::tag header carries another name"; exit 1; }
          git merge-base --is-ancestor "refs/tags/$GITHUB_REF_NAME^{commit}" origin/main || { echo "::error::tagged commit is not on main"; exit 1; }
          # Keys from main, never from the tagged commit: a side commit could add its own key.
          git show origin/main:crates/steno-core/release-signers > "$RUNNER_TEMP/release-signers"
          git -c gpg.format=ssh -c gpg.ssh.program=ssh-keygen \
              -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/release-signers" \
              -c gpg.program=/usr/bin/false -c gpg.x509.program=/usr/bin/false \
              verify-tag "refs/tags/$GITHUB_REF_NAME"
      - name: Tag version matches the code
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$TAG" = "$CODE" || { echo "::error::tag v$TAG, but Cargo.toml says $CODE (scripts/bump-version.sh)"; exit 1; }
      - name: Create the release (notes generated from pull requests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.3.0-rc1) is a pre-release: never offered to installed apps.
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $PRE --title "Sténo ${GITHUB_REF_NAME#v}"
