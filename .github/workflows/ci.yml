name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the Swift sidecar and the app on macOS (macOS minutes are billed at a higher rate)"
        type: boolean
        default: false

jobs:
  linux:
    # Required status check: this exact name must stay in sync with .github/rulesets/main.json
    # (required_status_checks). It will be renamed together with the ruleset.
    name: Tests (cœur, CLI, politique lecture seule, UI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: System dependencies (Tauri app, Linux audio sidecar, test sound server)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libpulse-dev meson ninja-build clang libclang-dev pulseaudio pulseaudio-utils
      - name: Test sound server (virtual outputs and microphone)
        run: |
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=speakers
          pactl load-module module-null-sink sink_name=micsink
          pactl load-module module-remap-source master=micsink.monitor source_name=virtual_mic
          pactl set-default-sink speakers && pactl set-default-source virtual_mic
      - name: UI (dependencies, checks, unit tests, build)
        working-directory: app/ui
        run: npm ci && npm run check && npm run test:unit && npm run build
      - name: Rust tests (unit, CLI functional, acceptance with the fake agent, command conformance)
        run: make sidecar-placeholder && cargo test --workspace
      - name: Search performance (500 meetings)
        run: cargo test -p steno-core --release --test perf -- --ignored
      - name: e2e tests (mock + real via steno serve)
        working-directory: app/ui
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: app/ui/playwright-report

  deb:
    name: Audio sidecar and Debian / Ubuntu package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Build packages
        run: make deps
      - name: .deb package (app, sidecar, CLI)
        run: make deb
      - name: Package installs and sidecar responds
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          steno-audio --version && steno --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: steno-deb
          path: target/release/bundle/deb/*.deb

  macos:
    name: Swift sidecar and app (macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sidecar
        working-directory: audio/StenoAudio
        run: swift build -c release && swift test
      - name: App
        run: make app
