name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Compiler aussi le sidecar Swift et l'app sur macOS (minutes macOS facturées plus cher)"
        type: boolean
        default: false

jobs:
  linux:
    name: Tests (cœur, CLI, politique lecture seule, UI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Dépendances système (app Tauri, sidecar audio Linux, serveur son de test)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libpulse-dev meson ninja-build clang libclang-dev pulseaudio pulseaudio-utils
      - name: Serveur son de test (sorties et micro virtuels)
        run: |
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=speakers
          pactl load-module module-null-sink sink_name=micsink
          pactl load-module module-remap-source master=micsink.monitor source_name=virtual_mic
          pactl set-default-sink speakers && pactl set-default-source virtual_mic
      - name: Interface (dépendances, vérification, tests unitaires, compilation)
        working-directory: app/ui
        run: npm ci && npm run check && npm run test:unit && npm run build
      - name: Tests Rust (unitaires, fonctionnels CLI, acceptation avec le faux agent, conformité des commandes)
        run: make sidecar-placeholder && cargo test --workspace
      - name: Performance de la recherche (500 réunions)
        run: cargo test -p steno-core --release --test perf -- --ignored
      - name: Tests e2e (maquette + réels via steno serve)
        working-directory: app/ui
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: app/ui/playwright-report

  deb:
    name: Sidecar audio et paquet Debian / Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Paquets de compilation
        run: make deps
      - name: Paquet .deb (app, sidecar, CLI)
        run: make deb
      - name: Le paquet s'installe et le sidecar répond
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          steno-audio --version && steno --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: steno-deb
          path: target/release/bundle/deb/*.deb

  macos:
    name: Sidecar Swift et app (macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sidecar
        working-directory: audio/StenoAudio
        run: swift build -c release && swift test
      - name: App
        run: make app
