name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the Swift sidecar and the app on macOS (macOS minutes are billed at a higher rate)"
        type: boolean
        default: false

jobs:
  linux:
    # Required status check: this exact name must stay in sync with .github/rulesets/main.json
    # (required_status_checks). It will be renamed together with the ruleset.
    name: Tests (cœur, CLI, politique lecture seule, UI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: System dependencies (Tauri app, Linux audio sidecar, test sound server)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libpulse-dev meson ninja-build clang libclang-dev pulseaudio pulseaudio-utils
      - name: Test sound server (virtual outputs and microphone)
        run: |
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=speakers
          pactl load-module module-null-sink sink_name=micsink
          pactl load-module module-remap-source master=micsink.monitor source_name=virtual_mic
          pactl set-default-sink speakers && pactl set-default-source virtual_mic
      - name: UI (dependencies, checks, unit tests, build)
        working-directory: app/ui
        run: npm ci && npm run check && npm run test:unit && npm run build
      - name: Rust tests (unit, CLI functional, acceptance with the fake agent, command conformance)
        run: make sidecar-placeholder && cargo test --workspace
      - name: Search performance (500 meetings)
        run: cargo test -p steno-core --release --test perf -- --ignored
      - name: e2e tests (mock + real via steno serve)
        working-directory: app/ui
        # The UI (npm run build) and target/debug/steno (cargo test) are already built above:
        # call Playwright directly instead of `npm run test:e2e`, which would build both again.
        run: npx playwright install --with-deps chromium && npx playwright test --project=maquette --project=reel
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: app/ui/playwright-report

  lint:
    name: Format and lints (rustfmt, clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: System dependencies (Tauri app, Linux audio sidecar)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libpulse-dev clang libclang-dev
      # Report-only until the one-off `cargo fmt --all` of the whole repository (planned right
      # after #12 merges): then remove `continue-on-error` so formatting is enforced.
      - name: rustfmt (report only for now)
        continue-on-error: true
        run: cargo fmt --all --check
      - name: UI build (the Tauri app embeds app/ui/dist)
        working-directory: app/ui
        run: npm ci && npm run build
      - name: clippy
        run: make sidecar-placeholder && cargo clippy --workspace --all-targets -- -D warnings

  deb:
    name: Audio sidecar and Debian / Ubuntu package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Build packages
        run: make deps
      - name: .deb package (app, sidecar, CLI)
        run: make deb
      - name: Package installs and sidecar responds
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          steno-audio --version && steno --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: steno-deb
          path: target/release/bundle/deb/*.deb

  # macOS runs only when it matters: on demand, or when a pull request or a push to main
  # touches macOS code (Swift sidecar, Tauri app, or the core and CLI that it bundles).
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "macos=${{ inputs.macos }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD 2>/dev/null \
            | grep -qE '^(audio/StenoAudio/|app/src-tauri/|crates/steno-core/|Makefile$)'; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: Swift sidecar and app (macOS)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sidecar
        working-directory: audio/StenoAudio
        run: swift build -c release && swift test
      - name: App
        run: make app
